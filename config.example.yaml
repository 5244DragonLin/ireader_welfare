# config.example.yaml —— 配置模板
# 复制为 config.yaml 后填写；config.yaml 已在 .gitignore 中，不会被提交

# 账号（也可用环境变量 IREADER_PHONE / IREADER_PWD，或命令行 --phone/--password）
phone: ""
password: ""

# 输出
output:
  dir: output             # 输出目录
  save_credentials: false # 是否把凭证摘要写入 output/credentials.json

# 说明：控制哪些动作要执行，用命令行开关（--no-wheel / --no-read 等），
#       不在本文件里配置。